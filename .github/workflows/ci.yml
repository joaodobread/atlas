name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nomes estáveis: usados como checks obrigatórios no ruleset da main ("CI / check" e "CI / image").
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: commgraph
          POSTGRES_USER: commgraph
          POSTGRES_PASSWORD: commgraph
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commgraph -d commgraph"
          --health-interval 5s --health-timeout 3s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: commgraph
          RUSTFS_SECRET_KEY: commgraph-secret
        ports: ['9000:9000']
    env:
      TEST_DATABASE_URL: postgres://commgraph:commgraph@127.0.0.1:5432/commgraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  image:
    name: image
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build da imagem de produção
        run: docker build -f containers/Containerfile -t comm-graph:ci .
