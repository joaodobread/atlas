name: Sugerir funcionalidade
description: Uma ideia para melhorar o Atlas.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Descreva a situação atual e por que ela incomoda.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução (telas, fluxo, configuração).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: input
    id: version
    attributes:
      label: Versão que você usa
      placeholder: v1.2.3
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribuição
      options:
        - label: Posso abrir um PR com essa mudança.
